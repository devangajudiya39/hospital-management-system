apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: hospital_management_system-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: hms-config
        - secretRef:
            name: hms-secrets
